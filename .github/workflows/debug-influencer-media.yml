name: Debug · Influencers · Material

on:
  # Solo lectura — ver scripts/debug-influencer-media.ts. El resultado
  # queda en los logs de esta corrida.
  workflow_dispatch:
    inputs:
      client_slug:
        description: "deca o adecco"
        required: true
        type: string
        default: deca
      campana:
        description: "Texto exacto de la campaña (igual a gold_influencers_*.campana)"
        required: true
        type: string
      influencer:
        description: "Texto exacto del influencer (igual a gold_influencers_*.influencer)"
        required: true
        type: string

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - run: npx tsx scripts/debug-influencer-media.ts "$CLIENT_SLUG" "$CAMPANA" "$INFLUENCER"
        env:
          CLIENT_SLUG: ${{ inputs.client_slug }}
          CAMPANA: ${{ inputs.campana }}
          INFLUENCER: ${{ inputs.influencer }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
