name: Sync gold (Fabric -> Supabase)

on:
  schedule:
    # ~09:00 UTC = ~06:00 Argentina. Minuto corrido a propósito: GitHub
    # recomienda evitar los minutos en punto (:00) porque son el momento de
    # más carga de todo Actions, y ahí es más común que un disparo se
    # demore o se pierda directamente — como pasó la primera vez que se
    # programó este workflow en el minuto 0 exacto.
    - cron: "9 9 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # @supabase/supabase-js necesita el WebSocket nativo de Node 22+
          # al crear el cliente, aunque no usemos nada de realtime.
          node-version: "22"

      - run: npm ci

      - run: npx tsx scripts/sync-gold.ts
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_FABRIC_RESOURCE_GROUP: ${{ secrets.AZURE_FABRIC_RESOURCE_GROUP }}
          AZURE_FABRIC_CAPACITY_NAME: ${{ secrets.AZURE_FABRIC_CAPACITY_NAME }}
          FABRIC_SQL_ENDPOINT: ${{ secrets.FABRIC_SQL_ENDPOINT }}
          FABRIC_DATABASE: ${{ secrets.FABRIC_DATABASE }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
