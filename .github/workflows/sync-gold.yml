name: Sync gold (Fabric -> Supabase)

on:
  schedule:
    # 09:00 UTC = 06:00 Argentina. Cron de GitHub Actions, no de Vercel: no
    # hay límite de 60/300 segundos acá, así que no hace falta escalonar
    # nada ni partir el trabajo en grupos.
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # @supabase/supabase-js necesita el WebSocket nativo de Node 22+
          # al crear el cliente, aunque no usemos nada de realtime.
          node-version: "22"

      - run: npm ci

      - run: npx tsx scripts/sync-gold.ts
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          FABRIC_SQL_ENDPOINT: ${{ secrets.FABRIC_SQL_ENDPOINT }}
          FABRIC_DATABASE: ${{ secrets.FABRIC_DATABASE }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
