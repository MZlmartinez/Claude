name: Sync gold (Fabric -> Supabase)

on:
  # El schedule nativo de GitHub Actions falló 2 días seguidos (ni con el
  # cron en minuto :00 ni corrido a :09) — directamente no se disparó solo
  # ninguna de las dos veces. El disparo diario pasó a vivir en el
  # scheduler de la sesión de Claude Code, que llama a este workflow por
  # la API (workflow_dispatch) todos los días ~09:09 UTC. Se deja
  # workflow_dispatch para ese uso y para poder correrlo a mano.
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # @supabase/supabase-js necesita el WebSocket nativo de Node 22+
          # al crear el cliente, aunque no usemos nada de realtime.
          node-version: "22"

      - run: npm ci

      - run: npx tsx scripts/sync-gold.ts
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_FABRIC_RESOURCE_GROUP: ${{ secrets.AZURE_FABRIC_RESOURCE_GROUP }}
          AZURE_FABRIC_CAPACITY_NAME: ${{ secrets.AZURE_FABRIC_CAPACITY_NAME }}
          FABRIC_SQL_ENDPOINT: ${{ secrets.FABRIC_SQL_ENDPOINT }}
          FABRIC_DATABASE: ${{ secrets.FABRIC_DATABASE }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Conexión directa a Postgres (no la API REST) — la necesita
          # refreshGrowthRollups() al final del sync, para recalcular las
          # vistas materializadas de Growth. Mismo valor que SUPABASE_DB_URL
          # en Vercel, pero hay que cargarlo acá también: son dos secret
          # stores separados.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
