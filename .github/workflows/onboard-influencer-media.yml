name: Onboarding · Influencers · Carpeta de material

on:
  workflow_dispatch:
    inputs:
      client_slug:
        description: "deca o adecco"
        required: true
        type: string
      campana:
        description: "Texto exacto de la campaña (igual a gold_influencers_*.campana)"
        required: true
        type: string
      drive_folder_id:
        description: "ID de la carpeta de Clipping de esa campaña (no la de 05_INFLUENCERS ni la de la campaña entera)"
        required: true
        type: string

jobs:
  onboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - run: npx tsx scripts/onboard-influencer-media.ts "$CLIENT_SLUG" "$CAMPANA" "$DRIVE_FOLDER_ID"
        env:
          CLIENT_SLUG: ${{ inputs.client_slug }}
          CAMPANA: ${{ inputs.campana }}
          DRIVE_FOLDER_ID: ${{ inputs.drive_folder_id }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
