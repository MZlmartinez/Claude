name: Admin · Despertar capacidad de Fabric (Adecco)

on:
  workflow_dispatch: {}

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - run: npx tsx scripts/wake-fabric.ts
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_FABRIC_RESOURCE_GROUP: ${{ secrets.AZURE_FABRIC_RESOURCE_GROUP }}
          AZURE_FABRIC_CAPACITY_NAME: ${{ secrets.AZURE_FABRIC_CAPACITY_NAME }}
